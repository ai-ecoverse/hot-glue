# kokoro-tract — Kokoro-82M under a pure WASI runtime, via tract.
#
#   git clone https://github.com/sonos/tract tools/tract
#   (cd tools/tract && git am ../../patches/tract/*.patch)
#   python3 scripts/fix-kokoro-onnx.py models/kokoro/onnx/model.onnx \
#     models/kokoro/onnx/model-fixed.onnx
#   cargo build --release --target wasm32-wasip1 \
#     --manifest-path tools/kokoro-tract/Cargo.toml
#   wasmtime --dir . \
#     tools/kokoro-tract/target/wasm32-wasip1/release/kokoro-tract.wasm \
#     models/kokoro/onnx/model-fixed.onnx voice.f32
[package]
name = "kokoro-tract"
version = "0.1.0"
edition = "2021"

[dependencies]
tract-onnx = { path = "../tract/onnx" }
serde_json = "1"

[profile.release]
opt-level = 2
